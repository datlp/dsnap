name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build dsnap with MSVC
      shell: cmd
      run: |
        rc /fo res\dsnap.res /Ires res\dsnap.rc
        cl /O2 /std:c++17 /EHsc /Isrc /Ires src\*.cpp res\dsnap.res /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib shell32.lib advapi32.lib ole32.lib oleaut32.lib strmiids.lib urlmon.lib /OUT:dsnap.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dsnap-windows-x64
        path: dsnap.exe

    - name: Package release assets
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $ver = "${{ github.ref_name }}".TrimStart('v')
        $exeVer = (Get-Item dsnap.exe).VersionInfo.FileVersion
        if ($exeVer -ne $ver) { throw "dsnap.exe version ($exeVer) does not match tag ($ver)" }

        New-Item -ItemType Directory -Force release | Out-Null
        Copy-Item dsnap.exe "release/dsnap-v$ver-windows-x64.exe"
        Copy-Item dsnap.exe "release/dsnap.exe"
        Compress-Archive -Path dsnap.exe, README.md, LICENSE -DestinationPath "release/dsnap-v$ver-windows-x64.zip" -Force

        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        & $iscc /Qp "/DMyAppVersion=$ver" installer\dsnap.iss
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

        Push-Location release
        Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
          ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
          Set-Content SHA256SUMS.txt -Encoding ascii
        Pop-Location

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.ref_name }}" (Get-ChildItem release -File).FullName --clobber --repo "${{ github.repository }}"
